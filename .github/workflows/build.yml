name: Build WiFi Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Ambil repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # Java 17
      # ==========================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # Gradle
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # Membuat struktur Android
      # ==========================================

      - name: Create Android project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/example/wifiscanner
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values


      # ==========================================
      # settings.gradle.kts
      # ==========================================

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WifiScanner"

          include(":app")
          EOF


      # ==========================================
      # build.gradle.kts
      # ==========================================

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF


      # ==========================================
      # gradle.properties
      # ==========================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


      # ==========================================
      # app/build.gradle.kts
      # ==========================================

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {

              namespace = "com.example.wifiscanner"

              compileSdk = 35

              defaultConfig {

                  applicationId = "com.example.wifiscanner"

                  minSdk = 23

                  targetSdk = 35

                  versionCode = 1

                  versionName = "1.0"
              }

              // Java dan Kotlin sama-sama menggunakan JVM 17
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {

              implementation(
                  "androidx.core:core-ktx:1.15.0"
              )

              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )
          }
          EOF


      # ==========================================
      # AndroidManifest.xml
      # ==========================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.ACCESS_WIFI_STATE" />

              <uses-permission
                  android:name="android.permission.CHANGE_WIFI_STATE" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Wi-Fi Scanner"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==========================================
      # styles.xml
      # ==========================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#3F51B5</item>

              </style>

          </resources>
          EOF


      # ==========================================
      # strings.xml
      # ==========================================

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">Wi-Fi Scanner</string>

          </resources>
          EOF


      # ==========================================
      # activity_main.xml
      # ==========================================

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Wi-Fi Scanner"
                      android:textSize="28sp"
                      android:textStyle="bold"
                      android:paddingBottom="10dp" />

                  <TextView
                      android:id="@+id/statusText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tekan tombol Scan Wi-Fi."
                      android:textSize="16sp"
                      android:paddingBottom="15dp" />

                  <Button
                      android:id="@+id/scanButton"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="SCAN WI-FI" />

                  <TextView
                      android:id="@+id/resultsText"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:fontFamily="monospace"
                      android:paddingTop="20dp" />

              </LinearLayout>

          </ScrollView>
          EOF


      # ==========================================
      # MainActivity.kt
      # ==========================================

          cat > app/src/main/java/com/example/wifiscanner/MainActivity.kt <<'EOF'
          package com.example.wifiscanner

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.net.wifi.ScanResult
          import android.net.wifi.WifiManager
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var wifiManager: WifiManager

              private lateinit var statusText: TextView

              private lateinit var resultsText: TextView

              private val permissionRequestCode = 1001

              private val scanReceiver =
                  object : BroadcastReceiver() {

                      override fun onReceive(
                          context: Context?,
                          intent: Intent?
                      ) {

                          val success =
                              intent?.getBooleanExtra(
                                  WifiManager.EXTRA_RESULTS_UPDATED,
                                  false
                              ) ?: false

                          if (success) {

                              showResults()

                          } else {

                              statusText.text =
                                  "Scan gagal atau hasil sebelumnya digunakan."

                              showResults()
                          }
                      }
                  }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  setContentView(
                      R.layout.activity_main
                  )

                  wifiManager =
                      applicationContext
                          .getSystemService(WIFI_SERVICE)
                          as WifiManager

                  statusText =
                      findViewById(R.id.statusText)

                  resultsText =
                      findViewById(R.id.resultsText)

                  findViewById<Button>(
                      R.id.scanButton
                  ).setOnClickListener {

                      startWifiScan()
                  }
              }

              override fun onStart() {

                  super.onStart()

                  ContextCompat.registerReceiver(
                      this,
                      scanReceiver,
                      IntentFilter(
                          WifiManager.SCAN_RESULTS_AVAILABLE_ACTION
                      ),
                      ContextCompat.RECEIVER_NOT_EXPORTED
                  )
              }

              override fun onStop() {

                  super.onStop()

                  unregisterReceiver(scanReceiver)
              }

              private fun startWifiScan() {

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION
                          ),
                          permissionRequestCode
                      )

                      return
                  }

                  if (!isLocationEnabled()) {

                      statusText.text =
                          "Aktifkan Location/GPS terlebih dahulu."

                      startActivity(
                          Intent(
                              Settings.ACTION_LOCATION_SOURCE_SETTINGS
                          )
                      )

                      return
                  }

                  statusText.text =
                      "Sedang memindai Wi-Fi..."

                  resultsText.text = ""

                  @Suppress("DEPRECATION")

                  val started =
                      wifiManager.startScan()

                  if (!started) {

                      statusText.text =
                          "Scan tidak dimulai. Coba lagi."
                  }
              }

              private fun showResults() {

                  @Suppress("DEPRECATION")

                  val results =
                      wifiManager.scanResults
                          .sortedByDescending {
                              it.level
                          }

                  statusText.text =
                      "${results.size} jaringan ditemukan."

                  if (results.isEmpty()) {

                      resultsText.text =
                          "Tidak ada Wi-Fi ditemukan."

                      return
                  }

                  val output =
                      StringBuilder()

                  results.forEachIndexed {
                      index,
                      result ->

                      val ssid =
                          if (result.SSID.isNullOrBlank()) {

                              "<Hidden SSID>"

                          } else {

                              result.SSID
                          }

                      output
                          .append(index + 1)
                          .append(". ")
                          .append(ssid)
                          .append("\n")

                      output
                          .append("   BSSID     : ")
                          .append(result.BSSID)
                          .append("\n")

                      output
                          .append("   Signal    : ")
                          .append(result.level)
                          .append(" dBm\n")

                      output
                          .append("   Frequency : ")
                          .append(result.frequency)
                          .append(" MHz\n")

                      output
                          .append("   Security  : ")
                          .append(
                              securityType(result)
                          )
                          .append("\n\n")
                  }

                  resultsText.text =
                      output.toString()
              }

              private fun securityType(
                  result: ScanResult
              ): String {

                  val capabilities =
                      result.capabilities
                          .uppercase(Locale.US)

                  return when {

                      "WPA3" in capabilities ->
                          "WPA3"

                      "WPA2" in capabilities ->
                          "WPA2"

                      "WPA" in capabilities ->
                          "WPA"

                      "WEP" in capabilities ->
                          "WEP"

                      else ->
                          "Open / Unknown"
                  }
              }

              private fun isLocationEnabled(): Boolean {

                  val locationManager =
                      getSystemService(
                          Context.LOCATION_SERVICE
                      ) as android.location.LocationManager

                  return locationManager
                      .isProviderEnabled(
                          android.location.LocationManager.GPS_PROVIDER
                      ) ||
                      locationManager
                          .isProviderEnabled(
                              android.location.LocationManager.NETWORK_PROVIDER
                          )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (
                      requestCode ==
                      permissionRequestCode &&

                      grantResults.isNotEmpty() &&

                      grantResults[0] ==
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      startWifiScan()

                  } else {

                      statusText.text =
                          "Izin diperlukan untuk scan Wi-Fi."
                  }
              }
          }
          EOF


      # ==========================================
      # Build APK
      # ==========================================

      - name: Build APK
        run: gradle :app:assembleDebug


      # ==========================================
      # Upload APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
